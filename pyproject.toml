[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "document-extraction-api"
version = "1.0.0"
description = "API assíncrona para extração confiável de PDFs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "PyMuPDF>=1.26,<2",
  "marker-pdf==2.0.0",
  "easyocr>=1.7.2,<2",
  "openai>=2.21,<3",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "slow: requer modelos pesados do Marker",
  "integration: teste de integração",
  "external: requer serviço externo e credenciais",
]
addopts = "-m 'not slow'"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "alembic/versions", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["marker.*", "markdownify", "easyocr"]
ignore_missing_imports = true
